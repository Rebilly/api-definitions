summary: Subscription renewal reminder, 1 day before renewal
description: |-
  Sends a reminder when an active order that contains subscription items is 1 day from renewal.
  The reminder is sent only when the recurring interval of the order is longer than 1 day.
  The reminder is not sent for a paused order, or for the renewal at the end of a trial.
  The reminder is sent once for that renewal, and remains available until the order renews.
  For more information, see [Subscription renewal reminders](https://www.rebilly.com/docs/dev-docs/orders/#subscription-renewal-reminders).
operationId: subscription-renewal-reminder-1-day
x-products:
  - Core
tags:
  - Orders
