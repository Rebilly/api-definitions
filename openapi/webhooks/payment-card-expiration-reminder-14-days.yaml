summary: Payment card expiration reminder, 14 days before expiration
description: |-
  Sends a reminder when the active default payment card of a customer is 14 days from expiring.
  The reminder is sent only when the customer has an order that contains subscription items,
  and that order has started and is not churned.
  The reminder is sent once for that expiration,
  and remains available until 7 days before the card expires.
  For more information, see [Payment card expiration reminders](https://www.rebilly.com/docs/dev-docs/payment-instruments/#payment-card-expiration-reminders).
operationId: payment-card-expiration-reminder-14-days
x-products:
  - Core
tags:
  - Payment instruments
requestBody:
  $ref: ../components/requestBodies/Webhooks/PaymentCardExpirationReminderWebhook.yaml
responses:
  '2xx':
    description: Returns any 2xx status to indicate that data is received.
