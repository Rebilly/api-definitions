parameters:
  - $ref: ../components/parameters/resourceId.yaml
post:
  x-products:
    - Core
  tags:
    - KYC documents
  summary: Update KYC document matches
  operationId: PostKycDocumentMatches
  x-sdk-operation-name: matches
  description: |-
    Updates the document matches of a KYC document with a specified ID.

    > **Note:** Use this operation for manual overrides.

    The request body schema depends on the KYC document `documentType`.
    The operation rejects unknown fields.

    Optionally send `type` with one of:
    `identity-proof`, `address-proof`, `purchase-proof`, or `funds-proof`.
    If provided, `type` matches the document type of the KYC document.
  requestBody:
    content:
      application/json:
        schema:
          anyOf:
            - $ref: ../components/schemas/KycIdentityMatchesOverwrite.yaml
            - $ref: ../components/schemas/KycAddressMatchesOverwrite.yaml
            - $ref: ../components/schemas/KycPurchaseMatchesOverwrite.yaml
            - $ref: ../components/schemas/KycFundsMatchesOverwrite.yaml
    description: KYC document matches overwrite payload.
    required: true
  responses:
    '204':
      description: Document matches updated.
      headers:
        X-RateLimit-Limit:
          $ref: ../components/headers/X-RateLimit-Limit.yaml
        X-RateLimit-Remaining:
          $ref: ../components/headers/X-RateLimit-Remaining.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
