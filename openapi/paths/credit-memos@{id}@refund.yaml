parameters:
  - $ref: ../components/parameters/resourceId.yaml
post:
  x-internal: true
  x-products:
    - Core
  tags:
    - Credit memos
  summary: Refund a credit memo
  operationId: PostCreditMemoRefund
  x-sdk-operation-name: refund
  description: |-
    Refunds a credit memo with a specified ID.
    The transactions of the last invoice for the order or the invoice directly related to the credit memo are refunded.
    If the credit memo available amount exceeds the refundable amount of invoice transactions,
    the request fails with a `409` response and no refund is created.
    If the credit memo has the `quotation` status, the request fails in the same way.
  responses:
    '200':
      description: Credit memo refunded.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreditMemo.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: Credit memo not refunded.
      $ref: ../components/responses/Conflict.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
