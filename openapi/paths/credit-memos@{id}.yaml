parameters:
  - $ref: ../components/parameters/resourceId.yaml
get:
  x-products:
    - Core
  tags:
    - Credit memos
  summary: Retrieve a credit memo
  parameters:
    - $ref: ../components/parameters/mediaTypeJsonPdf.yaml
  operationId: GetCreditMemo
  x-sdk-operation-name: get
  security:
    - SecretApiKey: []
    - JWT: []
    - ApplicationJWT: []
  description: Retrieves a credit memo with a specified ID.
  responses:
    '200':
      description: Credit memo retrieved.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreditMemo.yaml
        application/pdf:
          schema:
            type: string
            format: binary
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
put:
  x-products:
    - Core
  tags:
    - Credit memos
  summary: Upsert a credit memo
  operationId: PutCreditMemo
  x-sdk-operation-name: update
  description: |-
    Creates or updates (upserts) a credit memo with a specified ID.
    If the credit memo has allocations, an update request cannot change the invoice or currency.
    If `unusedAmount` is `0`, an update request also cannot change the shipping amount or items.
    To change any of these properties, void the credit memo and create a new one.
    If the credit memo cannot be voided, these properties are final.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreditMemo.yaml
  responses:
    '200':
      description: Credit memo updated.
      headers:
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreditMemo.yaml
    '201':
      description: Credit memo created.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreditMemo.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
patch:
  x-products:
    - Core
  tags:
    - Credit memos
  summary: Partially update a credit memo
  operationId: PatchCreditMemo
  x-sdk-operation-name: patch
  description: |-
    Partially updates a credit memo with a specified ID.
    If `unusedAmount` is `0`, this operation cannot change the shipping amount or items.
    To change any of these properties, void the credit memo and create a new one.
    If the credit memo cannot be voided, these properties are final.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requestBodies/PatchCreditMemoRequest.yaml
  responses:
    '200':
      description: Credit memo updated.
      headers:
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreditMemo.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
