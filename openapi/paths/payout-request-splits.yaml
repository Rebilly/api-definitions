post:
  x-badges:
    - name: Experimental
  x-products:
    - Core
  tags:
    - Transactions
  summary: Create a payout request split
  operationId: PostPayoutRequestSplit
  x-sdk-operation-name: create
  description: |-
    Splits a payout request that is in `pending`, `ready`, or `approved` status into two or more separate requests.

    Use this operation when the full amount cannot be processed due to amount restrictions, but a smaller amount can be processed.
    For example, if a payout request for `$4,000` cannot be processed, but `$3,000` can be processed, split the request into two. This allows you to approve and process `$3,000` instead of blocking the entire request.

    Provide an array of at least two amounts; one new payout request is created per amount.
    The sum of the amounts must equal the original payout request amount.
    Each new payout request is created in `pending` status.
    The original request transitions to the `split` status.
    This operation returns the newly created payout requests.
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            payoutRequestId:
              type: string
              description: ID of the payout request to split.
              maxLength: 50
              example: pout_req_0YVDMDE2BMC6KBB5MX76RF6T80
            amounts:
              description: |-
                Amounts for each new payout request.
                One request is created per amount.
                Provide at least two amounts.
                Each amount must be greater than zero.
                The sum must equal the original payout request amount.
              type: array
              minItems: 2
              maxItems: 100
              items:
                type: number
                format: double
                x-type: Money
                exclusiveMinimum: 0
              example: [50.00, 30.00, 20.00]
            splitReason:
              $ref: ../components/schemas/PayoutRequestSplitReason.yaml
            splitDescription:
              description: Additional description for splitting the payout request.
              type:
                - 'string'
                - 'null'
              maxLength: 255
          required:
            - payoutRequestId
            - amounts
            - splitReason
    description: Payout request split resource.
    required: true
  responses:
    '201':
      description: Payout requests created by the split operation.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        X-RateLimit-Limit:
          $ref: ../components/headers/X-RateLimit-Limit.yaml
        X-RateLimit-Remaining:
          $ref: ../components/headers/X-RateLimit-Remaining.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/PayoutRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
