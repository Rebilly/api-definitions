parameters:
  - $ref: ../components/parameters/resourceId.yaml
post:
  x-products:
    - Core
  tags:
    - Invoices
  summary: Recalculate an invoice
  operationId: PostInvoiceRecalculation
  x-sdk-operation-name: recalculate
  description: |-
    Recalculates shipping rates, taxes, and discounts on an invoice with a specified ID.

    One use case for this operation to apply a revoked coupon,
    or coupon that is redeemed by a customer after the invoice is issued.

    Shipping amount recalculation depends on the `shipping.calculator` property:

    - If `shipping.calculator` is `manual` and the invoice is issued, the shipping amount is not changed.
    - If `shipping.calculator` is `manual` and the invoice is a scheduled draft or a quotation, the shipping amount is 0 if no invoice item requires shipping.
    - If `shipping.calculator` is `rebilly`, the shipping amount is recalculated from the current shipping rates.
      This amount can differ from the original shipping amount of the invoice.
      The shipping amount is 0 if no invoice item requires shipping.
      A scheduled draft without a shipping rate also gets a shipping amount of 0.
  responses:
    '201':
      description: Invoice recalculated.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Invoice.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
  x-codeSamples:
    - lang: PHP
      source:
        $ref: ../code_samples/PHP/invoices@{id}@recalculate/post.php
