parameters:
  - $ref: ../components/parameters/resourceId.yaml
post:
  x-products:
    - Core
  tags:
    - AML
  summary: Review an AML check
  operationId: PostAmlCheckReview
  x-sdk-operation-name: review
  description: |-
    Reviews an AML check.
    Records a decision on each listed hit, then applies `status` to every hit that has no decision yet.
    The status of the AML check is calculated from the hit decisions.
    If any hit has no decision, the AML check remains in review.
    If any hit is a confirmed match, the AML check is a confirmed match.
    If every hit is a false positive, the AML check is a false positive.
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AmlCheckReview.yaml
  responses:
    '201':
      description: AML check reviewed.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AmlCheck.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
