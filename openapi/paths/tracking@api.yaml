get:
  x-products:
    - Users
  tags:
    - Tracking
  summary: Retrieve API tracking logs
  operationId: GetTrackingApiCollection
  x-sdk-operation-name: getAllApiLogs
  description: |-
    Retrieves API tracking log records.
    To retrieve the records faster, use `fields` to omit `request`, `response`, `requestHeaders`, and `responseHeaders`.
    Then retrieve the full record of a log with the [Retrieve an API tracking log](https://www.rebilly.com/catalog/all/tracking/gettrackingapi) operation.
  parameters:
    - $ref: ../components/parameters/collectionLimitMax100.yaml
    - $ref: ../components/parameters/collectionOffset.yaml
    - $ref: ../components/parameters/collectionSort.yaml
    - $ref: ../components/parameters/collectionFilter.yaml
    - $ref: ../components/parameters/collectionQuery.yaml
    - $ref: ../components/parameters/collectionExpand.yaml
    - $ref: ../components/parameters/collectionFields.yaml
  responses:
    '200':
      description: Tracking API logs retrieved.
      headers:
        Pagination-Total:
          $ref: ../components/headers/Pagination-Total.yaml
        Pagination-Limit:
          $ref: ../components/headers/Pagination-Limit.yaml
        Pagination-Offset:
          $ref: ../components/headers/Pagination-Offset.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/ApiTracking.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
  x-codeSamples:
    - lang: PHP
      label: PHP-SDK-2.0
      source:
        $ref: ../code_samples/PHP-SDK-2.0/tracking@api/get.php
    - lang: JavaScript
      source:
        $ref: ../code_samples/JavaScript/tracking@api/get.js
    - lang: PHP
      source:
        $ref: ../code_samples/PHP/tracking@api/get.php
