parameters:
  - $ref: ../components/parameters/resourceId.yaml
post:
  x-products:
    - Core
  tags:
    - Orders
  summary: Change order items
  operationId: PostOrderItemsChange
  x-sdk-operation-name: changeItems
  parameters:
    - $ref: ../components/parameters/orderExpand.yaml
  description: |-
    Changes order items or quantities and specifies if and when to give pro rata credits.
    To change the items at the next renewal, use the `POST /order-changes` operation with `applyAt` set to `nextRenewal`.
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/OrderItemsChange.yaml
    description: Change items request.
    required: true
  responses:
    '201':
      description: Order changed.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        X-RateLimit-Limit:
          $ref: ../components/headers/X-RateLimit-Limit.yaml
        X-RateLimit-Remaining:
          $ref: ../components/headers/X-RateLimit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Order.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      description: |-
        Change to the order items rejected.
        For example, the next renewal invoice is already issued with a pending order change.
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
