parameters:
  - $ref: ../components/parameters/resourceId.yaml
post:
  x-products:
    - Core
  tags:
    - Quotes
  summary: Reissue a quote
  operationId: PostQuoteReissue
  x-sdk-operation-name: reissue
  description: |-
    Reissues an expired, canceled, or rejected quote with a specified ID.
    This operation assigns the quote the `status` of `issued`,
    clears the `canceledTime` and `rejectedTime` fields,
    and resets the fulfilled acceptance conditions.
    If the request omits `expirationTime`, the quote keeps its expiration time when it has not passed,
    otherwise the quote expires one month after it is reissued.

    This operation restores the voided quotation invoice to the `quotation` status,
    and recalculates the invoice from the current quote items and order.
    Reissuing a quote triggers the same webhooks, rules, and timeline entries as issuing it.
    To reissue a change or reactivation quote, the order must still allow that quote type,
    and no other draft or issued quote may exist for the same order.
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/QuoteReissue.yaml
    description: Quote reissue resource.
  responses:
    '200':
      description: Quote reissued.
      headers:
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Quote.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
