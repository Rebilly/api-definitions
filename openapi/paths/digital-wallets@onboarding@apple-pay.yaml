get:
  x-products:
    - Users
  tags:
    - Gateway accounts
  summary: Retrieve Apple Pay domains
  operationId: GetDigitalWalletOnboardingApplePay
  x-sdk-operation-name: getApplePayDomains
  description: |-
    Retrieves the domains that Apple Pay has registered for the organization.
    Apple Pay registers domains for the whole organization, not for one gateway account.
  responses:
    '200':
      description: Apple Pay domains retrieved.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DigitalWalletOnboardingApplePayDomains.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
post:
  x-products:
    - Users
  tags:
    - Gateway accounts
  summary: Register a domain for Apple Pay
  operationId: PostDigitalWalletOnboardingApplePay
  x-sdk-operation-name: create
  description: |-
    Registers a domain for Apple Pay.

    Use this operation to register the domain with Apple Pay,
    or to check if it is already registered.
    When the domain is registered, you can use Apple Pay with your embedded integrations.

    For more information, see [Set up Apple Pay](/docs/dev-docs/digital-wallets#set-up-apple-pay).
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/DigitalWalletOnboardingApplePay.yaml
    description: Apple pay domain registration request.
    required: true
  security:
    - SecretApiKey: []
    - JWT: []
  responses:
    '200':
      description: Action executed without error.
      headers:
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DigitalWalletOnboardingApplePay.yaml
    '201':
      description: Domain registered with Apple Pay.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DigitalWalletOnboardingApplePay.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
