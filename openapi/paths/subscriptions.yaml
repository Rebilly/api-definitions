      source:
        $ref: ../code_samples/PHP/subscriptions/get.php
post:
  x-products:
    - Core
  tags:
    - Orders (legacy)
  summary: Create an order
  operationId: PostSubscription
  x-sdk-operation-name: create
  description: |-
    Creates an order.

    To create or update an order with a specified ID, use the [`PUT /subscriptions/{id}`](https://www.rebilly.com/catalog/all/orders-(legacy)/putsubscription) operation.

    Organizations that use the current order model cannot create legacy orders, and this operation returns a validation error for them.
    To create an order with the current order model, use the [`POST /orders`](https://www.rebilly.com/catalog/all/orders/postorder) operation.
  parameters:
    - $ref: ../components/parameters/subscriptionExpand.yaml
  requestBody:
    $ref: ../components/requestBodies/Subscription.yaml
  responses:
    '201':
      description: Order created.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SubscriptionOrOneTimeSale.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
  x-codeSamples:
    - lang: PHP
      label: PHP-SDK-2.0
      source:
        $ref: ../code_samples/PHP-SDK-2.0/subscriptions/post.php
    - lang: JavaScript
      source:
        $ref: ../code_samples/JavaScript/subscriptions/post.js
    - lang: PHP
      source:
        $ref: ../code_samples/PHP/subscriptions/post.php
