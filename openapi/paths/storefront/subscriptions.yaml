post:
  x-internal: true
  x-badges:
    - name: Experimental
  x-products:
    - Storefront
  tags:
    - Storefront orders
  summary: Create a subscription
  operationId: StorefrontPostSubscription
  x-sdk-operation-name: create
  description: |-
    Creates a subscription order in a billing portal.

    Organizations that use the current order model cannot create legacy orders, and this operation returns a validation error for them.
  security:
    - CustomerJWT: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../components/requestBodies/storefront/PostSubscription.yaml
    description: Create an order request.
    required: true
  responses:
    '201':
      description: Subscription created.
      headers:
        Location:
          $ref: ../../components/headers/Location.yaml
        Rate-Limit-Limit:
          $ref: ../../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/StorefrontOrder.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '422':
      $ref: ../../components/responses/ValidationError.yaml
    '429':
      $ref: ../../components/responses/TooManyRequests.yaml
