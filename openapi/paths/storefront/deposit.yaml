post:
  x-internal: true
  x-products:
    - Storefront
  x-badges:
    - name: Experimental
  tags:
    - Storefront deposits
  summary: Create a deposit
  operationId: StorefrontPostDeposit
  x-sdk-operation-name: create
  security:
    - CustomerJWT: []
  description: Creates a deposit transaction.
  requestBody:
    $ref: ../../components/requestBodies/storefront/PostDeposit.yaml
  responses:
    '201':
      description: Transaction created.
      headers:
        Location:
          $ref: ../../components/headers/Location.yaml
        Rate-Limit-Limit:
          $ref: ../../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/StorefrontTransaction.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      description: |-
        Access forbidden, or a restriction on deposits is active for the customer.
        If a restriction on deposits is active, `type` is `deposit-restricted`, and the customer is not charged.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../../components/schemas/ProblemTypes/Forbidden.yaml
              - $ref: ../../components/schemas/ProblemTypes/DepositRestricted.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      description: |-
        Promotion in `promotionId` does not apply to the deposit.
        The deposit amount, currency, and payment method are checked against the promotion rules before the deposit is charged.
        The customer is not charged.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ProblemTypes/PromotionIneligible.yaml
    '422':
      $ref: ../../components/responses/ValidationError.yaml
    '429':
      $ref: ../../components/responses/TooManyRequests.yaml
    '503':
      description: |-
        Deposit is refused because a condition of the deposit cannot be verified.
        The customer is not charged.
        The `type` value identifies the check that is not available:

        - `promotion-check-unavailable`: Promotion in `promotionId` cannot be verified against the deposit.
          Retry the request, or send it without `promotionId` to deposit without a promotion.
        - `deposit-restriction-check-unavailable`: Restrictions on deposits cannot be verified for the customer.
          Retry the request.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../../components/schemas/ProblemTypes/PromotionCheckUnavailable.yaml
              - $ref: ../../components/schemas/ProblemTypes/DepositRestrictionCheckUnavailable.yaml
