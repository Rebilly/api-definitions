parameters:
  - $ref: ../../components/parameters/resourceId.yaml
delete:
  x-internal: true
  x-badges:
    - name: Experimental
  x-products:
    - Storefront
  tags:
    - Storefront orders
  summary: Cancel an order change
  operationId: StorefrontDeleteOrderChange
  x-sdk-operation-name: delete
  security:
    - CustomerJWT: []
  description: |-
    Cancels a pending change to the items of an order of the customer.
    The current items of the order stay as they are.
    A change cannot be canceled after it is locked by an issued invoice, applied, canceled, or superseded.
  responses:
    '204':
      description: Order change canceled.
      headers:
        X-RateLimit-Limit:
          $ref: ../../components/headers/X-RateLimit-Limit.yaml
        X-RateLimit-Remaining:
          $ref: ../../components/headers/X-RateLimit-Remaining.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '429':
      $ref: ../../components/responses/TooManyRequests.yaml
