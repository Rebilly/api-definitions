get:
  x-internal: true
  x-badges:
    - name: Experimental
  x-products:
    - Storefront
  tags:
    - Storefront orders
  summary: Retrieve order changes
  operationId: StorefrontGetOrderChangeCollection
  x-sdk-operation-name: getAll
  security:
    - CustomerJWT: []
  description: |-
    Retrieves a list of changes to the items of the orders of the customer.
    To find the pending change of an order, use `filter=orderId:{orderId};status:pending`.
  parameters:
    - $ref: ../../components/parameters/collectionLimit.yaml
    - $ref: ../../components/parameters/collectionOffset.yaml
    - $ref: ../../components/parameters/collectionFilter.yaml
  responses:
    '200':
      description: List of order changes retrieved.
      headers:
        Pagination-Total:
          $ref: ../../components/headers/Pagination-Total.yaml
        Pagination-Limit:
          $ref: ../../components/headers/Pagination-Limit.yaml
        Pagination-Offset:
          $ref: ../../components/headers/Pagination-Offset.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../components/schemas/StorefrontOrderChange.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
