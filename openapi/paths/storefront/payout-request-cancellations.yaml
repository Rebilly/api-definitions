post:
  x-internal: true
  x-badges:
    - name: Experimental
  x-products:
    - Storefront
  tags:
    - Storefront cashiers
  summary: Cancel pending payout requests
  operationId: StorefrontPostPayoutRequestCancellation
  x-sdk-operation-name: create
  security:
    - CustomerJWT: [ ]
  description: |-
    Cancels pending payout requests that are associated with a cashier resource.

    - To cancel all pending payout requests, omit the `amount` field.
    - To cancel payout requests based on a specific amount, include the amount in the request body.
    The oldest requests are canceled first until the specified amount is reached.
  requestBody:
    $ref: ../../components/requestBodies/storefront/PostPayoutRequestCancellation.yaml
  responses:
    '200':
      description: Canceled all applicable pending cashier payout requests.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Cashier.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '422':
      $ref: ../../components/responses/ValidationError.yaml
