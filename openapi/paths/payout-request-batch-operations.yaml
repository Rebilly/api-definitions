post:
  x-internal: true
  x-badges:
    - name: Experimental
  x-products:
    - Core
  tags:
    - Transactions
  summary: Create a payout request batch operation
  operationId: PostPayoutRequestBatchOperations
  x-sdk-operation-name: create
  description: |-
    Creates a payout request batch operation that applies one action to a payout request batch.
    A payout request batch is a group of payout requests that you manage together.

    The `type` field specifies the action:
    - `approve`: Approves payout requests in the `ready` status.
    - `block`: Blocks payout requests that are not blocked and can be blocked in their current status.
    - `unblock`: Removes the block from blocked payout requests.
    - `auto-allocate`: Creates allocations automatically for payout requests that can be allocated.
    - `process`: Queues pending allocations of the payout requests in the batch for processing.
    - `add`: Adds the specified payout requests, or the payout requests that match a filter, to the batch.
    - `remove`: Removes the specified payout requests from the batch.

    A batch contains a maximum of 1000 payout requests.
    For `add` and `remove`, the operation is atomic.
    If the operation cannot add or remove a specified payout request,
    the operation returns a `409` response and changes no batch membership.
    For the other types, each payout request is checked independently.
    Payout requests that do not qualify for the action are skipped.
    For `process`, allocations that do not qualify are skipped, and allocations that qualify are queued together.
    If queueing fails, no allocation is queued and the operation returns an error.
    The operation completes before the response returns.
    If the batch does not exist, the operation returns a `422` response.
  requestBody:
    required: true
    description: Action to apply to a payout request batch.
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PayoutRequestBatchOperationRequest.yaml
  responses:
    '200':
      description: Batch operation completed.
      headers:
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PayoutRequestBatchOperation.yaml
    '400':
      description: Invalid filter provided or no payout requests match the filter.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProblemTypes/Problem.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      description: Batch limit reached or would be exceeded by the request, a specified payout request is already associated with another batch, or a specified payout request is not associated with this batch.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProblemTypes/Conflict.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
