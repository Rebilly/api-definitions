post:
  x-internal: true
  x-badges:
    - name: Experimental
  x-products:
    - Core
  tags:
    - Transactions
  summary: Create a payout request batch operation
  operationId: PostPayoutRequestBatchOperations
  x-sdk-operation-name: create
  description: |-
    Creates a payout request batch operation and applies one action to every payout request in the batch.
    A payout request batch groups payout requests so one action applies to every request in the group.

    The `type` field specifies the action:
    - `approve`: Approves payout requests in the `ready` status.
    - `block`: Blocks payout requests that are not blocked and can be blocked in their current status.
    - `unblock`: Removes the block from blocked payout requests.
    - `auto-allocate`: Creates allocations automatically for payout requests that can be allocated.
    - `process`: Queues pending allocations of the payout requests in the batch for processing.

    Each payout request is checked independently.
    Payout requests that do not qualify for the action are skipped.
    For `process`, allocations that do not qualify are skipped, and allocations that qualify are queued together.
    If queueing fails, no allocation is queued and the operation returns an error.
    The operation completes before the response returns.
    If the batch does not exist, the operation returns a `422` response.
  requestBody:
    required: true
    description: Action to apply to a payout request batch.
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PayoutRequestBatchOperationRequest.yaml
  responses:
    '200':
      description: Batch operation completed.
      headers:
        X-RateLimit-Limit:
          $ref: ../components/headers/X-RateLimit-Limit.yaml
        X-RateLimit-Remaining:
          $ref: ../components/headers/X-RateLimit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PayoutRequestBatchOperation.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
