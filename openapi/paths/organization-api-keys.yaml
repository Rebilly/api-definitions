get:
  x-products:
    - Users
  tags:
    - API keys
  summary: Retrieve organization API keys
  operationId: GetOrganizationApiKeyCollection
  x-sdk-operation-name: getAll
  description: |-
    Retrieves a list of API keys that members of the organization own.
    API keys with permissions that grant access only to other organizations are not listed.
    This operation is for organization administrators who audit API keys.
    The `owner` property of each API key identifies the member who owns it.
    For a secret key, `secretKey` is masked.
    For a publishable key, `secretKey` contains the full value.
  parameters:
    - $ref: ../components/parameters/collectionFilter.yaml
    - $ref: ../components/parameters/collectionSort.yaml
    - $ref: ../components/parameters/collectionLimit.yaml
    - $ref: ../components/parameters/collectionOffset.yaml
  responses:
    '200':
      description: List of API keys retrieved.
      headers:
        Pagination-Total:
          $ref: ../components/headers/Pagination-Total.yaml
        Pagination-Limit:
          $ref: ../components/headers/Pagination-Limit.yaml
        Pagination-Offset:
          $ref: ../components/headers/Pagination-Offset.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/OrganizationApiKey.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
