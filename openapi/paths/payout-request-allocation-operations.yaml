post:
  x-internal: true
  x-badges:
    - name: Experimental
  x-products:
    - Core
  tags:
    - Transactions
  summary: Create a payout request allocation operation
  operationId: PostPayoutRequestAllocationOperations
  x-sdk-operation-name: create
  description: |-
    Creates a payout request allocation operation and queues the given allocations for processing.

    The `type` field specifies the action:
    - `process`: Queues the given allocations for processing.

    Only allocations with status `pending` are processed.
    Rejects the request without queueing allocations when any allocation uses an inactive gateway account
    or a gateway account with payout instruction `none`.
    Poll the allocation status for the result.
    The operation completes before the response returns.
  requestBody:
    required: true
    description: Action to apply to payout request allocations.
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PayoutRequestAllocationOperationRequest.yaml
  responses:
    '200':
      description: Allocation operation completed.
      headers:
        Rate-Limit-Limit:
          $ref: ../components/headers/Rate-Limit-Limit.yaml
        Rate-Limit-Remaining:
          $ref: ../components/headers/Rate-Limit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PayoutRequestAllocationOperation.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
