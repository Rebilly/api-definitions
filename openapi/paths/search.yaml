get:
  x-internal: true
  x-products:
    - Core
  tags:
    - Search
  summary: Search merchant data
  operationId: GetSearch
  x-sdk-operation-name: get
  description: Searches merchant data to return resources such as customers, invoices, orders, transactions.
  parameters:
    - $ref: ../components/parameters/collectionSort.yaml
    - $ref: ../components/parameters/collectionLimit.yaml
    - $ref: ../components/parameters/collectionOffset.yaml
    - name: q
      in: query
      required: true
      description: |-
        Default search.
        Searches across resources and fields.
        Leading and trailing spaces are removed before the length is checked.
      schema:
        type: string
        minLength: 3
        maxLength: 500
  responses:
    '200':
      description: Results keyed by a resource.
      headers:
        Pagination-Total:
          $ref: ../components/headers/Pagination-Total.yaml
        Pagination-Limit:
          $ref: ../components/headers/Pagination-Limit.yaml
        Pagination-Offset:
          $ref: ../components/headers/Pagination-Offset.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Search.yaml
    '400':
      description: Invalid search query provided.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProblemTypes/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
