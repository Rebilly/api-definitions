parameters:
  - $ref: ../components/parameters/resourceId.yaml
post:
  x-products:
    - Core
  tags:
    - Credit memos
  summary: Void a credit memo
  operationId: PostCreditMemoVoid
  x-sdk-operation-name: void
  description: |-
    Voids a credit memo with a specified ID.
    Removes the invoice allocations of the credit memo and returns the allocated amounts to the invoices.
    If the credit memo is allocated to an invoice that is not payable, such as a paid invoice,
    the request fails with a `409` response and the credit memo is not changed.
  responses:
    '201':
      description: Credit memo voided.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        X-RateLimit-Limit:
          $ref: ../components/headers/X-RateLimit-Limit.yaml
        X-RateLimit-Remaining:
          $ref: ../components/headers/X-RateLimit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreditMemo.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
