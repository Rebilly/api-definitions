get:
  x-products:
    - Core
  tags:
    - Orders
  summary: Retrieve order changes
  operationId: GetOrderChangeCollection
  x-sdk-operation-name: getAll
  description: |-
    Retrieves a list of order changes.
    To find the pending change of an order, use `filter=orderId:{orderId};status:pending`.
  parameters:
    - $ref: ../components/parameters/collectionLimit.yaml
    - $ref: ../components/parameters/collectionOffset.yaml
    - $ref: ../components/parameters/collectionFilter.yaml
    - $ref: ../components/parameters/collectionSort.yaml
  responses:
    '200':
      description: List of order changes retrieved.
      headers:
        Pagination-Total:
          $ref: ../components/headers/Pagination-Total.yaml
        Pagination-Limit:
          $ref: ../components/headers/Pagination-Limit.yaml
        Pagination-Offset:
          $ref: ../components/headers/Pagination-Offset.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/OrderChange.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
post:
  x-products:
    - Core
  tags:
    - Orders
  summary: Change order items
  operationId: PostOrderChange
  x-sdk-operation-name: create
  description: Changes the items of an order immediately, or schedules the change for the next renewal.
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/OrderChange.yaml
    description: Order change resource.
    required: true
  responses:
    '201':
      description: Order change created.
      headers:
        Location:
          $ref: ../components/headers/Location.yaml
        X-RateLimit-Limit:
          $ref: ../components/headers/X-RateLimit-Limit.yaml
        X-RateLimit-Remaining:
          $ref: ../components/headers/X-RateLimit-Remaining.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrderChange.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      description: |-
        Order change rejected.
        For example, the order is in trial, the next renewal invoice is already issued,
        or the new items are the same as the current items.
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/ValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
