title: Flat rate
description: |-
  Flat-rate coin pricing that multiplies the full paid amount in minor units by `coinsPerFiatMinor`.
  For example, if `coinsPerFiatMinor` is `10`,
  a `$10.00` deposit credits `10,000` coins and a `$10.01` deposit credits `10,010` coins.
type: object
additionalProperties: false
required:
  - formula
  - coinsPerFiatMinor
properties:
  formula:
    type: string
    description: Flat-rate formula for converting the paid fiat amount into coins.
    enum:
      - flat-rate
  coinsPerFiatMinor:
    type: integer
    minimum: 1
    maximum: 1000000
    example: 10
    description: |-
      Number of coins credited for each minor unit of the paid currency.
      For example, a value of `10` means 10 coins for each US cent.
