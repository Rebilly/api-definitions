type: object
properties:
  id:
    description: ID of the user.
    readOnly: true
    $ref: ./ResourceId.yaml
  email:
    description: Email address of the user.
    readOnly: true
    type: string
    format: email
    maxLength: 100
  firstName:
    description: User's first name.
    readOnly: true
    type: string
  lastName:
    description: User's last name.
    readOnly: true
    type: string
  businessPhone:
    description: User's business phone number.
    readOnly: true
    type:
      - 'string'
      - 'null'
  mobilePhone:
    description: User's mobile phone number.
    readOnly: true
    type:
      - 'string'
      - 'null'
  permissions:
    description: |-
      Permissions that the user has within organizations.
      Use the wildcard character `*` for full access.
    readOnly: true
    allOf:
      - $ref: ./AclPermissions.yaml
  createdTime:
    $ref: ./CreatedTime.yaml
  updatedTime:
    $ref: ./UpdatedTime.yaml
  availableCurrencies:
    type: array
    description: Array of reporting currencies that are enabled for the merchant.
    readOnly: true
    items:
      type: string
  reportingCurrency:
    description: |-
      User's currency code in ISO 4217 format.
      This value is used for reports.
    type: string
    readOnly: true
  loginTime:
    description: Date and time when the user last logged in.
    type:
      - 'string'
      - 'null'
    format: date-time
    readOnly: true
  status:
    description: Status of the user account.
    type: string
    enum:
      - active
      - inactive
      - pending-confirmation
    readOnly: true
  country:
    description: |-
      User's country of residence in ISO 3166 alpha-2 country code.
      For examples, see [ISO.org](https://www.iso.org/obp/ui/#search/code/).
    readOnly: true
    type: string
  preferences:
    description: |-
      User preferences, such as: timezone, language, and more.
      This is an object with custom properties.
    type:
      - 'object'
      - 'null'
  hasPermissionsEmulation:
    type: boolean
    description: Specifies if the current user session has permissions emulation enabled.
    readOnly: true
  displayName:
    type: string
    description: User's full display name.
    readOnly: true
  hash:
    type: string
    description: Unique hash value that represents the user.
    readOnly: true
  requiresCardOnFile:
    type: boolean
    description: Specifies whether the current organization must have a payment card on file before it can transact in the live environment.
    readOnly: true
    default: false
  hasCardOnFile:
    type: boolean
    description: Specifies whether the current organization has an active payment card on file.
    readOnly: true
    default: false
  billingManagementToken:
    type:
      - 'string'
      - 'null'
    format: password
    description: |-
      Session token used to manage the payment method on file for a Rebilly subscription.
      This value is returned only to organization owners.

      {% admonition type="warning" %}
      Treat as a secret.
      Do not log, do not expose in URLs, do not store in shared client storage.
      {% /admonition %}
    readOnly: true
  pastDueInvoice:
    type:
      - 'object'
      - 'null'
    description: |-
      Details of the oldest past-due invoice for the Rebilly subscription associated with the current organization.
      This value is returned to all organization members to support consistent enforcement of the billing gate.
      The `token` is returned only to organization owners.
    readOnly: true
    required:
      - invoiceId
      - websiteId
      - token
    properties:
      invoiceId:
        type: string
        description: ID of the past-due invoice.
        maxLength: 50
        readOnly: true
      websiteId:
        type: string
        description: ID of the website for the invoice.
        maxLength: 50
        readOnly: true
      token:
        type:
          - 'string'
          - 'null'
        format: password
        description: |-
          JWT that is used to authorize payment of the invoice through the Rebilly Instruments JavaScript library.
          This value is `null` for non-owners, who cannot pay the invoice.

          {% admonition type="warning" %}
          Treat as a secret.
          Do not log, do not expose in URLs, do not store in shared client storage.
          {% /admonition %}
        readOnly: true
  _links:
    $ref: ./SelfLink.yaml
