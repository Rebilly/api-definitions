type: object
required:
  - faceProofRequired
additionalProperties: false
description: Conditions that determine when a document subtype is prohibited.
properties:
  faceProofRequired:
    type: boolean
    description: |-
      Specifies if the restriction depends on face proof being required for the KYC request.
      Use `true` if face proof is required, or `false` if it is not required.
