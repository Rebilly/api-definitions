type: object
properties:
  expirationTime:
    description: |-
      Date and time when the reissued quote expires.
      A new expiration time must be later than the current time.
      If this field is `null` or omitted and the current expiration time has not passed, the current expiration time is retained.
      If this field is `null` or omitted and the current expiration time has passed, the quote expires one month after it is reissued.
    type:
      - 'string'
      - 'null'
    format: date-time
