type: object
properties:
  expirationTime:
    description: |-
      Date and time when the reissued quote expires.
      If this field is `null` or omitted, the quote keeps its expiration time when it has not passed.
      Otherwise, the quote expires one month after it is reissued.
    type:
      - 'string'
      - 'null'
    format: date-time
