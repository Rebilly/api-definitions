type: object
required:
  - type
  - batchId
properties:
  type:
    description: Type of operation that removes the block from payout requests in the batch.
    type: string
    enum:
      - unblock
  batchId:
    description: |-
      ID of the payout request batch.
      A payout request batch groups payout requests so one action applies to every request in the group.
    type: string
    maxLength: 50
    example: prb_0YVDMDE2BMC6KBB5MX76RF6T80
