type: object
required:
  - type
  - batchId
properties:
  type:
    description: Type of operation that removes the block from payout requests in the batch.
    type: string
    enum:
      - unblock
  batchId:
    description: |-
      ID of the payout request batch.
      A payout request batch groups payout requests so one action applies to every request in the group.
    type: string
    maxLength: 50
    example: prb_0YVDMDE2BMC6KBB5MX76RF6T80
  payoutRequestIds:
    description: |-
      IDs of the payout requests to unblock.
      To unblock every blocked payout request in the batch, omit this property.
    type: array
    minItems: 1
    maxItems: 1000
    uniqueItems: true
    items:
      type: string
      maxLength: 50
      example: pout_req_0YVDMDE2BMC6KBB5MX76RF6T80
