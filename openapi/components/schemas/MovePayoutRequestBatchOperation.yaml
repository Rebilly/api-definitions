type: object
required:
  - type
  - batchId
  - targetBatchId
  - payoutRequestIds
properties:
  type:
    description: Type of operation that moves payout requests from one batch to another.
    type: string
    enum:
      - move
  batchId:
    description: |-
      ID of the source payout request batch.
      A payout request batch groups payout requests so one action applies to every request in the group.
    type: string
    maxLength: 50
    example: prb_0YVDMDE2BMC6KBB5MX76RF6T80
  targetBatchId:
    description: |-
      ID of the destination payout request batch.
      This value must be different from `batchId`.
    type: string
    maxLength: 50
    example: prb_0YV7HY7KZ7FFSP8WE60M9DAP8T
  payoutRequestIds:
    description: IDs of the payout requests to move from the source batch to the destination batch.
    type: array
    minItems: 1
    maxItems: 1000
    uniqueItems: true
    items:
      type: string
      maxLength: 50
      example: pout_req_0YVDMDE2BMC6KBB5MX76RF6T80
