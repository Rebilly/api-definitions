type: object
required:
  - type
  - batchId
  - payoutRequestIds
properties:
  type:
    description: Type of operation that removes payout requests from the batch.
    type: string
    enum:
      - remove
  batchId:
    description: |-
      ID of the payout request batch.
      A payout request batch groups payout requests so one action applies to every request in the group.
    type: string
    maxLength: 50
    example: prb_0YVDMDE2BMC6KBB5MX76RF6T80
  payoutRequestIds:
    description: IDs of the payout requests to remove from the batch.
    type: array
    minItems: 1
    maxItems: 1000
    uniqueItems: true
    items:
      type: string
      maxLength: 50
      example: pout_req_0YVDMDE2BMC6KBB5MX76RF6T80
