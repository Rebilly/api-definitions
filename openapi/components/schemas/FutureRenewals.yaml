type: object
properties:
  data:
    description: Future renewals data.
    type: array
    items:
      type: object
      description: Contains an aggregation.
      readOnly: true
      properties:
        date:
          type: string
          description: Date in `YYYY-MM` format.
        sum:
          type: number
          format: double
          description: |-
            Total amount of future renewals in the reporting currency of the signed-in user.
            For plans with metered billing, renewal amounts are calculated using the minimum plan quantity.
            If a plan has no minimum quantity, the renewal amount is 0.
        unpricedRenewalsCount:
          type: integer
          description: |-
            Number of future renewals in the month that are excluded from `sum` because their prices cannot be calculated.
            These renewals are still included in `plansCount`.
        plansCount:
          type: array
          description: Plan within the aggregation.
          items:
            type: object
            readOnly: true
            properties:
              planId:
                type: string
                description: ID of the plan.
                maxLength: 50
                example: plan_0YV7DENSVGDBW9S71XZNNYYQ0X
              count:
                type: integer
                description: Total number of future renewals of a plan.
