type: object
required:
  - type
  - batchId
properties:
  type:
    description: Type of operation that adds payout requests to the batch.
    type: string
    enum:
      - add
  batchId:
    description: |-
      ID of the payout request batch.
      A payout request batch groups payout requests so one action applies to every request in the group.
    type: string
    maxLength: 50
    example: prb_0YVDMDE2BMC6KBB5MX76RF6T80
  payoutRequestIds:
    description: IDs of the payout requests to add to the batch.
    type: array
    minItems: 1
    maxItems: 1000
    uniqueItems: true
    items:
      type: string
      maxLength: 50
      example: pout_req_0YVDMDE2BMC6KBB5MX76RF6T80
  filter:
    description: |-
      Filter string that selects payout requests to add to the batch.
      This field uses the same format as filter parameters for collections.
      Use semicolons to separate multiple filter conditions.

      Available fields for filtering: `id`, `status`, `websiteId`, `customerId`, `currency`, `amount`, `createdTime`, `updatedTime`.

      The operation ignores a `batchId` filter.
      Filter results always exclude payout requests that are already associated with a batch.
      If the filter matches more payout requests than the remaining batch capacity,
      the operation adds only the oldest matching requests up to the batch limit,
      sorted by creation time.
    type: string
    minLength: 1
    example: 'status:pending;websiteId:ws_0YVDMDE2BMC6KBB5MX76RF6T80'
oneOf:
  - title: Explicit IDs
    required:
      - payoutRequestIds
  - title: Filter-based
    required:
      - filter
