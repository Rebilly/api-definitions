type: object
description: Customer information.
properties:
  id:
    type: string
    description: ID of the customer.
    readOnly: true
    example: cus_0YV7DDSDD1C8DA64KHH2W33CPF
    maxLength: 50
  email:
    description: Customer's email address.
    type:
      - 'string'
      - 'null'
    format: email
    readOnly: true
    x-sortable: true
    x-basic: true
  firstName:
    description: Customer's first name.
    type:
      - 'string'
      - 'null'
    x-basic: true
    readOnly: true
  lastName:
    description: Customer's last name.
    type:
      - 'string'
      - 'null'
    x-sortable: true
    x-basic: true
    readOnly: true
  websiteId:
    x-sortable: true
    allOf:
      - $ref: ./WebsiteId.yaml
  paymentToken:
    type: string
    writeOnly: true
    description: |-
      Write-only payment token.
      If supplied, the token is converted into a payment instrument, and its ID is assigned to `defaultPaymentInstrumentId` value.
      The value of this property overrides the `defaultPaymentInstrumentId` if both are supplied.
      This token may only be used once before it expires.
  defaultPaymentInstrument:
    type:
      - 'object'
      - 'null'
    description: |-
      Default payment instrument of the customer.

      The default payment instrument is used to automatically pay subscription renewals,
      and for transaction requests where a specific payment instrument is not provided.
    readOnly: true
    required:
      - method
      - paymentInstrumentId
    properties:
      method:
        $ref: ./PaymentMethod.yaml
      paymentInstrumentId:
        type: string
        description: ID of the payment instrument.
        maxLength: 50
        example: inst_0YVB8KPKNXCBR9EDX7JHSED75N
  defaultPaymentInstrumentId:
    type:
      - 'string'
      - 'null'
    description: |-
      ID of the customer's default payment instrument.

      The default payment instrument is used to automatically pay subscription renewals,
      and for transaction requests where a specific payment instrument is not provided.
    maxLength: 50
    example: inst_0YVB8KPKNXCBR9EDX7JHSED75N
    writeOnly: true
  preferredPayoutInstrumentId:
    type:
      - 'string'
      - 'null'
    description: ID of the customer's preferred payment instrument for payouts.
    maxLength: 50
    example: inst_0YVB8KPKNXCBR9EDX7JHSED75N
    default: null
  createdTime:
    $ref: CreatedTime.yaml
  updatedTime:
    $ref: UpdatedTime.yaml
  customFields:
    $ref: ./ResourceCustomFields.yaml
  primaryAddress:
    description: Customer's primary address.
    oneOf:
      - $ref: ./ContactObject.yaml
      - type: 'null'
  company:
    $ref: Company.yaml
  averageValue:
    $ref: ./CustomerAverageValue.yaml
  paymentCount:
    x-label: Payments
    x-sortable: true
    x-basic: true
    description: |-
      Total number of approved payments made by the customer.
      Payments are the result of `sale` or `capture` transactions.
    readOnly: true
    type: integer
  lastPaymentTime:
    x-label: Last Payment
    x-sortable: true
    x-basic: true
    description: |-
      Date and time when the customer made their last approved payment.
      Payments are the result of `sale` or `capture` transactions.
    type:
      - 'string'
      - 'null'
    format: date-time
    readOnly: true
  lifetimeRevenue:
    $ref: ./CustomerLifetimeRevenue.yaml
  invoiceCount:
    x-sortable: true
    description: |-
      Total number of invoices issued to the customer.
      This value is auto-incrementing.
      If this value is `0`, the record relates to a lead.
      A lead is a customer who has not made a payment yet.
      If this value is greater than or equal to `1` the record relates to a customer.
    readOnly: true
    type: integer
  tags:
    description: List of customer tags.
    readOnly: true
    type: array
    items:
      $ref: ./Tag.yaml
  revision:
    description: |-
      Number of times the customer's data has been modified.

      Use this value when analyzing webhook data to determine if a change must take precedence over the current representation.
    type: integer
    readOnly: true
  hasFulfilledKyc:
    description: Specifies if the customer has accepted and reviewed identity and address documents, or an accepted credit file document.
    type: boolean
    readOnly: true
  organizationId:
    readOnly: true
    allOf:
      - $ref: ./OrganizationId.yaml
  locale:
    type:
      - 'string'
      - 'null'
    description: Language locale identifier in [RFC 5646](https://tools.ietf.org/html/rfc5646) format.
    example: fr-FR
    default: null
  taxNumbers:
    type:
      - 'array'
      - 'null'
    description: Tax numbers of the customer.
    items:
      $ref: ./TaxNumber.yaml
  leadSource:
    allOf:
      - $ref: ./LeadSourceData.yaml
    writeOnly: true
  personId:
    type:
      - 'string'
      - 'null'
    description: ID of the associated person.
    maxLength: 50
    example: prs_0YV7DDSDD1C8DA64KHH2W33CPF
  notificationEmails:
    type: array
    description: |-
      Email addresses for notification delivery in event-based email notifications.
      When you configure event-based email notifications, you can send to these addresses, the customer's primary email address, or another email address you specify.
      For more information, see [Manage notification emails](https://www.rebilly.com/docs/data-tables/manage-customer-information#manage-notification-emails).
    items:
      type: string
      format: email
  _links:
    type: array
    description: Related links.
    readOnly: true
    items:
      type: object
      properties:
        href:
          description: Link URL.
          type: string
        rel:
          description: Type of link.
          type: string
          enum:
            - self
            - attachments
            - defaultPaymentInstrument
            - leadSource
            - website
  _embedded:
    type: object
    description: Embedded objects that are requested using the `expand` query string parameter.
    readOnly: true
    properties:
      defaultPaymentInstrument:
        type: object
      website:
        type: object
      leadSource:
        type: object
