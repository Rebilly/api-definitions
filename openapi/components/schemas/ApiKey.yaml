type: object
description: API secret Key.
required:
  - description
properties:
  id:
    type: string
    readOnly: true
    description: ID of the API key.
    maxLength: 50
    example: api_key_0YV7JQMY6ED2FBE58BMFHBWBZH
  description:
    description: API key description.
    type: string
  type:
    description: Type of API key.
    type: string
    default: secret
    enum:
      - secret
      - publishable
  acl:
    description: |-
      Permissions for this API key.

      A request is authorized only when these permissions include the permission for the operation,
      and the associated user has that permission.
      If these permissions include `*`, each operation is limited to the permissions of the associated user.
      If the associated user loses a permission and these permissions still include that permission, a request that requires that permission is not authorized.
      If the associated user gains a permission, a request that requires that permission is authorized only when these permissions include that permission or `*`.
      For more information, see [Ownership of an API key](https://www.rebilly.com/docs/dev-docs/api-keys/#ownership-of-an-api-key).
    $ref: ./Acl.yaml
  allowedIps:
    $ref: ./AllowedIps.yaml
  apiUser:
    description: API user name.
    type: string
    readOnly: true
  secretKey:
    description: |-
      Value of the API secret key.
      For a secret key, the full value is returned only in the response to the request that creates the key.
      Other responses return a masked value that keeps only the prefix and the `apiUser` value.
      For a publishable key, every response returns the full value.
    type: string
    readOnly: true
  createdTime:
    $ref: CreatedTime.yaml
  updatedTime:
    $ref: UpdatedTime.yaml
  _links:
    $ref: ./SelfLink.yaml
