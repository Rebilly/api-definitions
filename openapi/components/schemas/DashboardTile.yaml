type: object
required:
  - metric
properties:
  metric:
    type: string
    description: |-
      Metric displayed in the tile.
      Publicly supported values are defined in `DashboardMetric`.
      Additional values are accepted.
  title:
    type:
      - 'string'
      - 'null'
    description: Custom tile title.
    minLength: 2
    maxLength: 36
  description:
    type:
      - 'string'
      - 'null'
    description: Custom tile description.
    minLength: 2
    maxLength: 48
  dateRange:
    type:
      - 'string'
      - 'null'
    description: |-
      Date range of the tile, in ISO-8601 interval format, extended with `NOW` and relative anchor tokens for relative dates.
      When omitted, the dashboard `dateRange` is used.
      Supported formats:

      - Start and end: `2024-01-01T00:00:00Z/2024-02-01T00:00:00Z`.
      - Start and duration `2024-01-01T00:00:00Z/P1M`.
      - Duration and end: `P1M/2024-02-01T00:00:00Z`.
      - Now and duration: `NOW-P1M/NOW`. This format represents the last month.
      - Month before last month: `NOW-P2M/NOW-P1M`.
      - Anchor tokens: `NOW_D`, `NOW_W`, `NOW_M` and `NOW_Y` resolve to the start of the current day, week, month or year when used as the start of the range, and to the end of that period when used as the end of the range.
        Combine an anchor with a signed duration, for example `NOW_M-P1M`, to shift the period after snapping to the boundary.
      - Today: `NOW_D/NOW_D`.
      - Yesterday: `NOW_D-P1D/NOW_D-P1D`.
      - This week: `NOW_W/NOW_D`.
      - Last week: `NOW_W-P1W/NOW_W-P1W`.
      - Last month: `NOW_M-P1M/NOW_M-P1M`.
  columnsWidth:
    type: integer
    description: Number of dashboard columns that the tile occupies.
    minimum: 1
    maximum: 2
    default: 1
  periodStart:
    type:
      - 'string'
      - 'null'
    format: date-time
    readOnly: true
    description: |-
      Date and time when the tile period starts.
      The value is resolved from the tile `dateRange`.
      This value is `null` when the tile does not define its own `dateRange`.
  periodEnd:
    type:
      - 'string'
      - 'null'
    format: date-time
    readOnly: true
    description: |-
      Date and time when the tile period ends.
      The value is resolved from the tile `dateRange`. 
      This value is `null` when the tile does not define its own `dateRange`.
