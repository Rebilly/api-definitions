title: Volume bracket
description: Amount range and coin rate for volume pricing.
type: object
additionalProperties: false
required:
  - coinsPerFiatMinor
properties:
  coinsPerFiatMinor:
    type: integer
    minimum: 1
    maximum: 1000000
    example: 10
    description: |-
      Number of coins credited for each minor unit of the paid currency when the paid amount falls in this range.
      For example, a value of `10` means 10 coins for each US cent.
  maxAmount:
    type:
      - 'number'
      - 'null'
    format: double
    minimum: 0
    maximum: 9999999
    example: 50
    description: |-
      Highest paid amount in this range, in major units of the currency for the deposit request.
      This value is inclusive and must be exact at that currency scale for the deposit amount strategy.
      A `null` value means this range has no upper limit.
