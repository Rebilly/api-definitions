type:
  - 'string'
  - 'null'
description: |-
  ID of the data export file.
  If the export contains more than 1,000,000 records,
  the file is a ZIP archive.
  The archive contains numbered part files,
  such as `example-part1.csv` and `example-part2.csv`,
  each with a maximum of 1,000,000 records.
  Each part file can be processed independently:

  - `csv` and `detailed-csv` part files repeat the header row.
  - `json` and `json-api` part files contain a complete array.
  - `xml` part files contain their own root element.

  `pdf` exports are always a ZIP archive that contains one PDF per record,
  and are never split into part files.
readOnly: true
maxLength: 50
example: file_0YV7HZ7KDCC5WBV9Q7WRKG1H6N
