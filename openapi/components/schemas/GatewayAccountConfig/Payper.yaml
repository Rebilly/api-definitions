description: Payper gateway configuration.
allOf:
  - $ref: ../GatewayAccount.yaml
  - type: object
    required:
      - credentials
    properties:
      credentials:
        type: object
        description: Payper credentials object.
        required:
          - secretKey
        properties:
          secretKey:
            type: string
            format: password
            description: Payper secret key.
            writeOnly: true
          tokenId:
            type: string
            description: |-
              ID of the TokenEx account that is used to tokenize payment cards.
              This value is required for payment card, Apple Pay, and Google Pay transactions.
          tokenApiKey:
            type: string
            format: password
            description: |-
              API key of the TokenEx account that is used to tokenize payment cards.
              This value is required for payment card, Apple Pay, and Google Pay transactions.
            writeOnly: true
      threeDSecureServer:
        $ref: ./ThreeDSecureIO3dsServer.yaml
      settings:
        type: object
        properties:
          delay:
            type: integer
            description: Automatic capture delay in hours.
            minimum: 0
            default: 0
          autodepositLookup:
            type: boolean
            description: Perform Interac e-Transfer Autodeposit lookup before a payout.
            default: false
          autodepositLookupInterval:
            type: integer
            description: Number of days to suppress Interac e-Transfer Autodeposit lookup.
          bypassAutodepositLookup:
            type: boolean
            default: false
            description: Specifies whether to proceed with the payout regardless of the Interac e-Transfer Autodeposit lookup result.
