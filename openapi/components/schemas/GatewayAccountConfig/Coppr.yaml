description: Coppr gateway configuration.
allOf:
  - $ref: ../GatewayAccount.yaml
  - type: object
    required:
      - credentials
    properties:
      credentials:
        type: object
        description: Coppr credentials object.
        properties:
          organizationId:
            type: string
            description: ID of the Coppr organization.
          apiKey:
            type: string
            description: Coppr API key.
            format: password
            writeOnly: true
          rebillySecretKey:
            type: string
            minLength: 1
            description: |-
              Rebilly secret API key with permission for the [Create a payment token](https://www.rebilly.com/catalog/all/payment-tokens/posttoken) operation.
              If `rebillyPublishableKey` is also provided,
              the payment token for each transaction is created with the secret key instead of the publishable key.
              To obtain an API key, see [Manage API keys](https://www.rebilly.com/docs/dev-docs/api-keys/#manage-api-keys).
            format: password
            writeOnly: true
        required:
          - organizationId
          - apiKey
      settings:
        type: object
        description: Coppr settings object.
        properties:
          rebillyPublishableKey:
            type: string
            description: |-
              Rebilly publishable API key.
              If this value is provided, a payment token is created for each transaction.
              Payment card transactions are declined if this value is not provided.
              To obtain an API key, see [Manage API keys](https://www.rebilly.com/docs/dev-docs/api-keys/#manage-api-keys).
