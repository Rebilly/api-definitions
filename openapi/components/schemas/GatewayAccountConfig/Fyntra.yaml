description: Fyntra gateway configuration.
allOf:
  - $ref: ../GatewayAccount.yaml
  - type: object
    required:
      - credentials
    properties:
      credentials:
        type: object
        description: Values that are used to authenticate the merchant to Fyntra.
        properties:
          clientId:
            type: string
            description: ID of the Fyntra client that is used to authenticate API requests.
          clientSecret:
            type: string
            description: Secret of the Fyntra client that is used to authenticate API requests.
            format: password
            writeOnly: true
          pointOfSaleId:
            type: string
            description: ID of the Fyntra point of sale.
          webhookSecret:
            type: string
            description: Secret that is used to verify Fyntra webhook signatures.
            format: password
            writeOnly: true
        required:
          - clientId
          - clientSecret
          - pointOfSaleId
          - webhookSecret
      settings:
        type: object
        properties:
          checkoutCurrency:
            type: string
            description: Cryptocurrency of the Fyntra checkout widget.
            default: USDC
            enum:
              - USDC
              - USDT
          minAmount:
            type: number
            minimum: 0
            description: |-
              Smallest deposit amount, in the currency of the checkout widget.
              A smaller deposit is declined.
              If this value is omitted, the minimum is `1`.
              If this value is `0`, no minimum applies.
          maxAmount:
            type: number
            minimum: 0
            description: |-
              Largest deposit amount, in the currency of the checkout widget.
              A larger deposit is declined.
              If this value is omitted or `0`, no maximum applies.
