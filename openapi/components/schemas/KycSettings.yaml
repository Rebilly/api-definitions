type: object
description: Settings for KYC score calculation.
properties:
  identityProof:
    $ref: ./KycSettingsIdentity.yaml
  addressProof:
    $ref: ./KycSettingsAddress.yaml
  scopedKycSettings:
    description: |-
      Document subtype restrictions for the organization and its websites.
      When updating KYC settings, this object replaces the existing scoped KYC settings.
      If this field is omitted, the existing scoped KYC settings do not change.
      Use `null` to remove all scoped KYC settings.
    oneOf:
      - $ref: ./ScopedKycSettings.yaml
      - type: 'null'
  uiVersion:
    description: Version of the KYC document gatherer UI.
    type:
      - 'string'
      - 'null'
    enum:
      - '1'
      - '2'
    default: '1'
    x-enumDescriptions:
      '1': Classic design.
      '2': Modern design, optimized for the best user experience on both mobile and desktop devices.
