type: object
description: |-
  Action applied to a payout request batch.
  A payout request batch is a group of payout requests that you manage together.
required:
  - type
  - batchId
  - status
properties:
  type:
    description: Type of action applied to the batch.
    type: string
    readOnly: true
    enum:
      - approve
      - block
      - unblock
      - auto-allocate
      - process
      - add
      - remove
  batchId:
    description: ID of the payout request batch.
    type: string
    readOnly: true
    maxLength: 50
    example: prb_0YVDMDE2BMC6KBB5MX76RF6T80
  status:
    description: |-
      Status of the operation.
      The operation completes before the response returns, so the status is always `completed`.
    type: string
    readOnly: true
    enum:
      - completed
