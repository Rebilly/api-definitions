type: object
required:
  - type
  - batchId
  - reason
properties:
  type:
    description: Type of operation that blocks payout requests in the batch.
    type: string
    enum:
      - block
  batchId:
    description: |-
      ID of the payout request batch.
      A payout request batch groups payout requests so one action applies to every request in the group.
    type: string
    maxLength: 50
    example: prb_0YVDMDE2BMC6KBB5MX76RF6T80
  reason:
    $ref: ./PayoutRequestBlockReason.yaml
  description:
    description: Additional description for blocking the payout requests in the batch.
    type:
      - 'string'
      - 'null'
    maxLength: 255
