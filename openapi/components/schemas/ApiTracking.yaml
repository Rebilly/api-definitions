type: object
description: API request tracking.
readOnly: true
properties:
  id:
    $ref: ./ResourceId.yaml
  status:
    type: integer
    description: Response code of the HTTP request.
  url:
    type: string
    x-basic: true
    description: URL of the HTTP request.
  route:
    type: string
    description: API request route.
    example: '/customers/{param}'
  method:
    type: string
    description: HTTP method of the API request.
    enum:
      - HEAD
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
    x-basic: true
  request:
    type: string
    description: Request body of the HTTP request.
  response:
    type: string
    description: Response body of the HTTP request.
  requestHeaders:
    $ref: ./HttpHeaders.yaml
  responseHeaders:
    $ref: ./HttpHeaders.yaml
  user:
    type: object
    description: User who made the request.
    readOnly: true
    properties:
      userId:
        type: string
        description: ID of the user.
        maxLength: 50
        example: usr_0YVCEENYJ3D7Q9EN6BN16HA0G4
      apiKeyId:
        type: string
        description: ID of the API tracking log.
        maxLength: 50
        example: api_key_0YV7JQMY6ED2FBE58BMFHBWBZH
      email:
        description: Email address of the user.
        type: string
        format: email
      firstName:
        description: First name of the user.
        type: string
      lastName:
        description: Last name of the user.
        type: string
      ipAddress:
        type: string
        deprecated: true
        description: Client IP address.
        format: ipv4
      userAgent:
        description: Software that is acting on behalf of the user.
        type: string
      fingerprint:
        description: |-
          User's device fingerprint hash.
          A device fingerprint is a unique token that is used to identify the user.
          The device fingerprint is generated based on device attributes,
          such as: hardware, software, IP address, language, browser, and more.
        type: string
      isSupport:
        description: Specifies if the API request is completed by a Rebilly Support Team member.
        type: boolean
  ipAddress:
    type: string
    x-basic: true
    description: Client IP address.
  relatedResourceIds:
    type: array
    description: IDs of related resources.
    readOnly: true
    items:
      type: string
    example:
      - in_0YVF9605RKC62BP14NE2R7V2XT
      - cus_0YV7DDSDD1C8DA64KHH2W33CPF
  duration:
    type: integer
    x-sortable: true
    x-basic: true
    description: Request duration in milliseconds.
  organizationId:
    $ref: ./OrganizationId.yaml
  createdTime:
    $ref: ./CreatedTime.yaml
  # Inlined from UpdatedTime. OpenAPI 3.0 ignores keywords beside $ref, and an allOf
  # wrapper makes generated clients type this field as any instead of a date-time string.
  updatedTime:
    type: string
    description: |-
      Date and time when the resource is updated.
      This value is set automatically when the resource is updated.
    format: date-time
    readOnly: true
    x-sortable: false
    x-label: Last Update Time
  _links:
    $ref: ./SelfLink.yaml
  _embedded:
    type: object
    description: Embedded objects that are requested by the `expand` query parameter.
    readOnly: true
    properties:
      organization:
        type: object
