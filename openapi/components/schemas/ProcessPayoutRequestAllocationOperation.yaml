type: object
required:
  - type
  - allocationIds
properties:
  type:
    description: Type of operation that queues the given allocations for processing.
    type: string
    enum:
      - process
  allocationIds:
    description: Array of allocation IDs to process.
    type: array
    minItems: 1
    maxItems: 1000
    items:
      type: string
      maxLength: 50
      example: pra_0YVDMDE2BMC6KBB5MX76RF6T80
