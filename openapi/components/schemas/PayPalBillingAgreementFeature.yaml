type: object
title: Billing agreement
required:
  - name
  - paypalMerchantId
  - paypalClientId
properties:
  name:
    type: string
    description: Name of the feature.
    enum:
      - PayPal billing agreement
  paypalMerchantId:
    type: string
    description: ID of the PayPal merchant.
  paypalClientId:
    type: string
    description: ID of the PayPal client.
  billingAgreementToken:
    type: string
    description: |-
      PayPal billing agreement token.
      This property is always included in the response of the [`POST /ready-to-pay`](https://www.rebilly.com/catalog/all/transactions/postreadytopay) operation.
  expirationTime:
    type: string
    format: date-time
    description: |-
      Date and time when the billing agreement token expires.
      This property is always included in the response of the [`POST /ready-to-pay`](https://www.rebilly.com/catalog/all/transactions/postreadytopay) operation.
