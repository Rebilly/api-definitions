name: limit
in: query
description: |-
  Maximum number of orders to return.
  To return an empty collection with the total number of matching orders in `Pagination-Total`, use `0`.
  If `expand` includes `activationInvoice`, `recentInvoice`, or `upcomingInvoice`,
  a maximum of `100` orders is returned.
schema:
  type: integer
  minimum: 0
  maximum: 1000
