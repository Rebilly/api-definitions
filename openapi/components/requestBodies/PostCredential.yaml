content:
  application/json:
    schema:
      oneOf:
        - $ref: ./PostSmtpCredential.yaml
        - $ref: ./PostWebhookCredential.yaml
        - $ref: ./PostExperianCredential.yaml
        - $ref: ./PostMailgunCredential.yaml
        - $ref: ./PostOAuth2Credential.yaml
        - $ref: ./PostPostmarkCredential.yaml
        - $ref: ./PostSendGridCredential.yaml
        - $ref: ./PostAwsSesCredential.yaml
        - $ref: ./PostTaxJarCredential.yaml
        - $ref: ./PostAvalaraCredential.yaml
        - $ref: ./PostPlaidCredential.yaml
      discriminator:
        propertyName: type
        mapping:
          smtp: ./PostSmtpCredential.yaml
          webhook: ./PostWebhookCredential.yaml
          experian: ./PostExperianCredential.yaml
          mailgun: ./PostMailgunCredential.yaml
          oauth2: ./PostOAuth2Credential.yaml
          postmark: ./PostPostmarkCredential.yaml
          sendgrid: ./PostSendGridCredential.yaml
          aws-ses: ./PostAwsSesCredential.yaml
          taxjar: ./PostTaxJarCredential.yaml
          avalara: ./PostAvalaraCredential.yaml
          plaid: ./PostPlaidCredential.yaml
description: Service credential resource.
required: true
