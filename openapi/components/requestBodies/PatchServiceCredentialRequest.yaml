type: object
required:
  - status
  - type
properties:
  status:
    description: Status of the credential.
    type: string
    enum:
      - active
      - inactive
      - deactivated
    x-enumDescriptions:
      active: Credential is active and can be used.
      inactive: Credential is temporarily inactivated and cannot be used until reactivated.
      deactivated: Credential is permanently deactivated and cannot be reactivated.
  type:
    description: |-
      Type of the credential.
      Value that matches the `{type}` path parameter.
      For backward compatibility, when this field is absent,
      the `{type}` path parameter supplies the credential type.
    type: string
    enum:
      - smtp
      - webhook
      - mailgun
      - sendgrid
      - aws-ses
      - oauth2
      - postmark
      - experian
      - avalara
