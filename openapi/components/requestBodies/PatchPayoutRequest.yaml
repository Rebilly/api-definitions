content:
  application/json:
    schema:
      type: object
      title: Patch payout request
      properties:
        status:
          description: Status of the request.
          type: string
          enum:
            - pending
            - ready
            - approved
            - canceled
          x-enumDescriptions:
            pending: Request was created by the customer.
            ready: Request was assessed, deemed eligible for processing and is ready for approval.
            approved: Request was approved and is ready for processing.
            canceled: Request is canceled. This status requires the `canceledBy` field.
        canceledBy:
          description: |-
            Initiator of the cancellation.
            Required when `status` is `canceled`.
          type: string
          enum:
            - customer
            - merchant
            - system
        cancellationDescription:
          description: |-
            Description of the cancellation reason.
            When a blocked payout request is canceled, the block reason is added to this description.
            For example, `Fraud confirmed` becomes `Fraud confirmed (blocked: fraud-suspected)`.
            If this field is omitted, the description is the block reason only, such as `blocked: fraud-suspected`.
            If the combined text is longer than 255 characters, the text before the block reason is shortened to fit.
          type:
            - 'string'
            - 'null'
          minLength: 1
          maxLength: 255
        description:
          description: Description of the payout request.
          type:
            - 'string'
            - 'null'
        blocked:
          description: |-
            Specifies if the payout request is blocked or unblocked.
            This field can only be applied to payout requests in the following statuses:
            `pending`, `ready`, `approved`, or `in-progress`.

            When a payout request is blocked, it cannot:
            - Transition to `ready`, `approved`, `in-progress`, `merged`, or `split`.
            - Have allocations created.
            - Start allocation processing.

            Cancellation of the payout request and pending allocations remains available.
            When a blocked payout request is canceled, `blocked` is set to `false`, `blockReason` is set to `null`,
            and the block reason is added to `cancellationDescription`.
            If allocation processing starts before the payout request is blocked, the request still transitions to the `fulfilled` status.
          type: boolean
          example: false
        blockReason:
          oneOf:
            - $ref: ../schemas/PayoutRequestBlockReason.yaml
            - type: 'null'
        blockDescription:
          description: Additional description for blocking the payout request.
          type:
            - 'string'
            - 'null'
          maxLength: 255
description: Fields for updating the payout request status, description, and blocked state.
