content:
  application/json:
    schema:
      properties:
        paymentCardId:
          description: ID of the payment card.
          type: string
        eventType:
          description: Type of event that triggered the webhook.
          type: string
          enum:
            - payment-card-expiration-reminder-14-days
            - payment-card-expiration-reminder-7-days
            - payment-card-expiration-reminder-1-day
        _embedded:
          type: object
          description: Embedded objects related to the payment card event.
          properties:
            paymentCard:
              $ref: ../../schemas/PaymentCard.yaml
        _links:
          type: array
          description: Links to related resources.
          items:
            type: object
            properties:
              href:
                description: URL of the link.
                type: string
              rel:
                description: Relationship type of the link.
                type: string
                enum:
                  - paymentCard
description: Payload of the payment card expiration reminder webhook event.
