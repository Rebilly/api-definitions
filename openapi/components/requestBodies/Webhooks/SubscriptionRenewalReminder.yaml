content:
  application/json:
    schema:
      properties:
        subscriptionId:
          type: string
          description: ID of the order.
          example: sub_01HRF27SATGE4Z6PBJE6PD8328
        renewalTime:
          type: string
          format: date-time
          description: Date and time when the subscription renews.
        eventType:
          description: Type of event that triggered the webhook.
          type: string
          enum:
            - subscription-renewal-reminder-30-days
            - subscription-renewal-reminder-7-days
            - subscription-renewal-reminder-1-day
        _embedded:
          type: object
          description: Embedded objects related to the order event.
          properties:
            subscription:
              $ref: ../../schemas/SubscriptionOrOneTimeSale.yaml
        _links:
          type: array
          description: Links to related resources.
          items:
            type: object
            properties:
              href:
                description: URL of the link.
                type: string
              rel:
                description: Relationship type of the link.
                type: string
                enum:
                  - subscription
description: Payload of the subscription renewal reminder webhook event.
