type: object
required:
  - file
properties:
  file:
    description: File in base64 encoded format.
    type: string
    example: R0lGODlhAQABAIAAAAUEBAAAACwAAAAAAQABAAACAkQBADs=
  isPublic:
    description: |-
      Specifies if the file is available publicly without authentication.
      If this value is `true`, the `permalink` and `cdn` links in the `_links` section contain the public URLs.
      The `cdn` link is served from a cache and accepts the `imageSize` query parameter for images.
    type: boolean
    example: false
  name:
    description: File name used for downloading.
    type: string
    maxLength: 255
    example: logo.png
  description:
    description: Description of the file.
    type: string
    maxLength: 255
    example: My file description
  sourceType:
    description: Source of the file.
    type:
      - 'string'
      - 'null'
    enum:
      - upload
      - camera
      - organization-export
      - organization-closure-export
      - null
    example: upload
  tags:
    description: List of tags associated with the file.
    type: array
    items:
      type: string
    example:
      - test
      - tags
