content:
  application/json:
    schema:
      allOf:
        - required:
            - username
            - password
          properties:
            username:
              type: string
              description: Username.
            password:
              type: string
              format: password
              description: Password.
            primaryAddress:
              $ref: ../../schemas/ContactObject.yaml
            paymentToken:
              type: string
              description: |-
                Write-only payment token;
                if supplied, it converts into a payment instrument and is set as the `defaultPaymentInstrument`.
                The value of this property overrides the `defaultPaymentInstrument` in the case that both are supplied.
                The token may only be used once before it is expired.
            leadSource:
              $ref: ../../schemas/LeadSourceData.yaml
            websiteId:
              $ref: ../../schemas/WebsiteId.yaml
              description: |-
                ID of the website where the customer signs up.
                If this value is not set, the account is associated with the first website of the organization.
