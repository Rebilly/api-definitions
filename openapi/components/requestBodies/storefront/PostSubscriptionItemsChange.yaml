type: object
description: Change customer subscription items.
properties:
  effectiveTime:
    type: string
    description: |-
      Effective time when changes are applied.
      If this value is `auto` or `next-service-period`, a downgrade is scheduled for the next renewal,
      and the quote `order.applyAt` value is `nextRenewal`.
      If the order cannot take a scheduled change, for example a legacy order or an order in trial,
      the downgrade is applied at the beginning of the next service period.
    default: auto
    enum:
      - now
      - next-service-period
      - auto
    x-enumDescriptions:
      now: Apply changes immediately.
      next-service-period: Schedule a downgrade for the next renewal. Apply an upgrade at the beginning of the next service period.
      auto: Schedule a downgrade for the next renewal. Apply an upgrade immediately.
  items:
    type: array
    description: Details of items in the subscription.
    minItems: 1
    items:
      type: object
      required:
        - planId
      properties:
        planId:
          type: string
          description: ID of the plan.
          maxLength: 50
          example: plan_0YV7DENSVGDBW9S71XZNNYYQ0X
        quantity:
          description: Number of units of the product on the given plan.
          type: integer
          minimum: 0
        quantityFilled:
          description: |-
            Number of filled product units.
            This field is not used for metered billing plans.
          type:
            - 'number'
            - 'null'
          format: double
          example: 5.125
        usageLimits:
          oneOf:
            - $ref: ../../schemas/UsageLimits.yaml
            - type: 'null'
          default: null
  preview:
    description: |-
      Specifies if the quote must be previewed before it is created.
      Subscriptions cannot be changed in the preview.
    type: boolean
    default: false
    example: true
  keepTrial:
    description: |-
      Specifies whether an active trial remains in the trial state or is upgraded to a paid subscription.
      If this field is set to `false`, the trial is converted to a paid subscription.
      > **Note:** This field applies only to subscriptions that are currently in trial.
    type: boolean
    default: true
    example: true
  autopay:
    description: |-
      Specifies if payment attempts for the related subscription are made automatically.
      If autopay is enabled, the payment is retrieved from the customer on the renewal date using the payment instrument that is set at `paymentInstrumentId`,
      or the default payment instrument on the subscription.
    type: boolean
    default: false
    example: true
  includeNextPeriod:
    description: |-
      Specifies if next service period amount must be included in the quote.
      This is applicable only for `trial-only` active subscriptions.
    type: boolean
    default: true
    example: true
