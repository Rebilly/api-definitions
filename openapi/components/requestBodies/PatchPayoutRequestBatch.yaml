content:
  application/json:
    schema:
      type: object
      title: Patch payout request batch
      properties:
        name:
          description: |-
            Name that is used to identify the batch.
            To retain the current name, omit this property.
            This value must be a string.
            To remove the name, set this property to an empty string.
          type: string
          maxLength: 255
          example: Weekly CAD payouts
        description:
          description: |-
            Description of the batch.
            To retain the current description, omit this property.
            This value must be a string.
            To remove the description, set this property to an empty string.
          type: string
          maxLength: 255
        allocationOrder:
          description: |-
            Order for auto-allocation of payout requests in this batch.
            When set, this field overrides the organization-level allocation order during batch auto-allocation.
            Must contain `selected-payment-instrument` exactly once.
            Valid values: `payment-card` (payment cards), `alternative-payment-methods` (catch-all for alternative payment methods), `selected-payment-instrument` (customer-requested instrument), or any payment method API name (for example, `paypal`, `Interac-eTransfer`).
            To retain the current allocation order, omit this property.
            This value must be an array.
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 25
          uniqueItems: true
          example:
            - paypal
            - Interac-eTransfer
            - payment-card
            - alternative-payment-methods
            - selected-payment-instrument
description: |-
  Fields for updating the payout request batch.
  At least one property must be present.
